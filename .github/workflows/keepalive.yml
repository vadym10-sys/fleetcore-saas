name: Keep Render services warm

on:
  # Scheduled runs are disabled because the production API Render service currently
  # accepts connections but does not return /health before the workflow timeout.
  # Re-enable with a low-frequency cron after https://fleetcore-api.onrender.com/health
  # returns HTTP 200 consistently, for example:
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping FleetCore web
        run: |
          curl --fail --show-error --location \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            https://fleetcore-web.onrender.com >/dev/null

      - name: Diagnose FleetCore API
        run: |
          curl --fail --show-error --location \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            https://fleetcore-api.onrender.com/health >/dev/null
